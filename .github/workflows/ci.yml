name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 7 * * 2'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.96.1 fmt --all -- --check
      - run: cargo +1.96.1 test --release --locked
      - run: cargo +1.96.1 clippy --all-targets --locked -- -D warnings

  audit:
    name: RustSec audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Install locked advisory checker
        run: cargo +1.96.1 install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependency graph
        run: cargo +1.96.1 audit
